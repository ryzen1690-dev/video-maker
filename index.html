<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="controls">
      <h1>Make a short video</h1>
      <p class="lead">Write one line per scene. Each line becomes a captioned scene, 15 to 90 seconds in total.</p>

      <label for="script">Your script</label>
      <textarea id="script" rows="7">Stop scrolling for 10 seconds.
Here is a trick most people never learn.
Write short lines, one per scene.
Add your own photos or clips if you like.
Then press Make video and download it.</textarea>

      <label for="media">Backgrounds (optional photos or video clips)</label>
      <input id="media" type="file" accept="image/*,video/*" multiple>

      <label for="music">Music (optional audio file)</label>
      <input id="music" type="file" accept="audio/*">

      <button id="make" type="button">Make video</button>
      <p id="status" role="status">Ready when you are.</p>
    </section>

    <section class="preview">
      <div class="phone">
        <canvas id="stage"></canvas>
      </div>
      <div id="result" hidden>
        <video id="player" controls playsinline></video>
        <a id="download" class="dl" href="#">Download video</a>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
